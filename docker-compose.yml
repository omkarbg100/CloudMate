services:
  ai-services:
    build:
      context: ./Ai-servises
      dockerfile: Dockerfile
    image: deploymate-ai-services:local
    container_name: deploymate-ai-services
    env_file:
      - path: ./Ai-servises/.env
        required: false
    ports:
      - "8000:8000"
    restart: unless-stopped

  mongodb:
    image: mongo:7-jammy
    container_name: deploymate-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: deploymate-backend:local
    container_name: deploymate-backend
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/deploymate
      AI_SERVICE_URL: http://ai-services:8000
      AI_ENGINE_URL: http://ai-services:8000
      FRONTEND_URL: http://localhost:5173
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-deploymate-secret-key-min-32-chars-length}
    ports:
      - "4000:4000"
    volumes:
      - deploymate-data:/app/data
    depends_on:
      - ai-services
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deploymate-frontend:local
    container_name: deploymate-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb-data:
  deploymate-data:
