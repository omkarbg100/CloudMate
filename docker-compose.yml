services:

  # ─── Local LLM — Primary inference engine ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: deploymate-ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Pull the model on first boot (one-shot, exits after pull)
  ollama-init:
    image: ollama/ollama:latest
    container_name: deploymate-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5-coder:7b"]
    restart: "no"

  # ─── AI Services ──────────────────────────────────────────────────────────
  ai-services:
    build:
      context: ./Ai-servises
      dockerfile: Dockerfile
    image: ${AI_SERVICE_IMAGE:-deploymate-ai-services:local}
    container_name: deploymate-ai-services
    environment:
      # Primary LLM (Ollama)
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      # Fallback LLM (Gemini)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      # Budget & config
      - MAX_TOTAL_TOKENS=${MAX_TOTAL_TOKENS:-50000}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REPO_AGENT_MAX_STEPS=${REPO_AGENT_MAX_STEPS:-15}
      - LITELLM_LOCAL_MODEL_COST_MAP=True
    env_file:
      - path: ./Ai-servises/.env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ─── Database ─────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: deploymate-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${SERVER_IMAGE:-deploymate-backend:local}
    container_name: deploymate-backend
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/deploymate}
      AI_SERVICE_URL: http://ai-services:8000
      AI_ENGINE_URL: http://ai-services:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-deploymate-secret-key-min-32-chars-length}
    ports:
      - "4000:4000"
    volumes:
      - deploymate-data:/app/data
    depends_on:
      ai-services:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${CLIENT_IMAGE:-deploymate-frontend:local}
    container_name: deploymate-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama-models:
  mongodb-data:
  deploymate-data:
