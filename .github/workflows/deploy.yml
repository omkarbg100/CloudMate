name: Deploy

on:
  push:
    branches: [deploymate]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: CloudMate Production

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate and clean Docker Hub username
        run: |
          CLEAN_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '\r\n ' | sed 's|^/*||; s|/*$||' | tr '[:upper:]' '[:lower:]')
          if [ -z "$CLEAN_USER" ]; then
            echo "::error::DOCKERHUB_USERNAME is missing or empty! Please ensure DOCKERHUB_USERNAME is set in your GitHub repository/environment secrets."
            exit 1
          fi
          echo "DOCKERHUB_USER=$CLEAN_USER" >> "$GITHUB_ENV"

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/cca-client:${{ github.sha }}
            ${{ env.DOCKERHUB_USER }}/cca-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push — backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/cca-server:${{ github.sha }}
            ${{ env.DOCKERHUB_USER }}/cca-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push — Ai-services
        uses: docker/build-push-action@v5
        with:
          context: ./Ai-servises
          file: ./Ai-servises/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/cca-ai-service:${{ github.sha }}
            ${{ env.DOCKERHUB_USER }}/cca-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VM
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          DOCKER_USER: ${{ env.DOCKERHUB_USER }}
          IMAGE_TAG: ${{ github.sha }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Normalize PEM key formatting: remove carriage returns, strip surrounding quotes, fix escaped newlines
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's|^"||; s|"$||' > ~/.ssh/deploy_key
          if grep -q '\\n' ~/.ssh/deploy_key; then
            sed -i 's/\\n/\n/g' ~/.ssh/deploy_key
          fi
          # Ensure a trailing newline exists (required by OpenSSH / libcrypto)
          [ -n "$(tail -c1 ~/.ssh/deploy_key)" ] && echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          REMOTE_DIR="~/codebase-chat-assistant"

          # Ensure remote project directory exists
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" "mkdir -p $REMOTE_DIR"

          # Copy docker-compose.yml to remote VM
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key docker-compose.yml "$VM_USER@$VM_HOST:$REMOTE_DIR/docker-compose.yml"

          # Generate production environment file safely and transfer to VM
          cat << EOF > remote.env
          CLIENT_IMAGE=${DOCKER_USER}/cca-client:${IMAGE_TAG}
          SERVER_IMAGE=${DOCKER_USER}/cca-server:${IMAGE_TAG}
          AI_SERVICE_IMAGE=${DOCKER_USER}/cca-ai-service:${IMAGE_TAG}
          MONGODB_URI=${MONGODB_URI}
          JWT_SECRET=${JWT_SECRET}
          GOOGLE_API_KEY=${GOOGLE_API_KEY}
          GEMINI_API_KEY=${GOOGLE_API_KEY}
          FRONTEND_PORT=80
          EOF

          # Trim leading spaces from remote.env
          sed -i 's/^[ \t]*//' remote.env

          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key remote.env "$VM_USER@$VM_HOST:$REMOTE_DIR/.env"
          rm -f remote.env

          # Ensure Docker is installed on the remote VM, then pull images and start containers
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" "
            set -e

            # Automatically install Docker and Docker Compose if not found
            if ! command -v docker &> /dev/null; then
              echo '=== Docker not found on VM. Installing Docker automatically via get.docker.com... ==='
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sudo sh /tmp/get-docker.sh
              sudo usermod -aG docker \$USER || true
              sudo systemctl enable --now docker || sudo service docker start || true
              rm -f /tmp/get-docker.sh
              echo '=== Docker installed successfully! ==='
            fi

            # Check if docker can run without sudo or if sudo is required for current session
            if docker info &> /dev/null; then
              DOCKER_CMD='docker'
            else
              DOCKER_CMD='sudo docker'
            fi

            echo \"Using: \$DOCKER_CMD\"
            cd $REMOTE_DIR
            \$DOCKER_CMD compose pull
            \$DOCKER_CMD compose up -d --remove-orphans
            \$DOCKER_CMD image prune -f
            \$DOCKER_CMD compose ps
          "

          # Clean up deploy key on runner
          rm -f ~/.ssh/deploy_key
