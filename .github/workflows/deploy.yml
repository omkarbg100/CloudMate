name: Deploy

on:
  push:
    branches: [deploymate]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: CloudMate Production

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate and clean Docker Hub username
        run: |
          CLEAN_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '\r\n ' | sed 's|^/*||; s|/*$||' | tr '[:upper:]' '[:lower:]')
          if [ -z "$CLEAN_USER" ]; then
            echo "::error::DOCKERHUB_USERNAME is missing or empty! Please ensure DOCKERHUB_USERNAME is set in your GitHub repository/environment secrets."
            exit 1
          fi
          echo "DOCKERHUB_USER=$CLEAN_USER" >> "$GITHUB_ENV"

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USER }}/cca-client:${{ github.sha }}

      - name: Build and push — backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USER }}/cca-server:${{ github.sha }}

      - name: Build and push — Ai-services
        uses: docker/build-push-action@v5
        with:
          context: ./Ai-servises
          file: ./Ai-servises/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USER }}/cca-ai-service:${{ github.sha }}

      - name: Deploy to VM
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_KEY" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} -t "
            cd ~/codebase-chat-assistant &&
            MONGODB_URI='${{ secrets.MONGODB_URI }}' \
            JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            GOOGLE_API_KEY='${{ secrets.GOOGLE_API_KEY }}' \
            CLIENT_IMAGE='${{ env.DOCKERHUB_USER }}/cca-client:${{ github.sha }}' \
            SERVER_IMAGE='${{ env.DOCKERHUB_USER }}/cca-server:${{ github.sha }}' \
            AI_SERVICE_IMAGE='${{ env.DOCKERHUB_USER }}/cca-ai-service:${{ github.sha }}' \
            docker compose up -d --pull always --remove-orphans
          "
